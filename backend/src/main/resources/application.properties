spring.application.name=smart-library
server.port=${SERVER_PORT:8080}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smart_library_spring?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.serialization.write-dates-as-timestamps=false
app.jwt.secret=${JWT_SECRET:change-this-development-secret-key-before-deployment-2026}
app.jwt.expiry-hours=${JWT_EXPIRY_HOURS:12}
app.library.loan-days=${LIBRARY_LOAN_DAYS:14}
app.library.borrow-limit=${LIBRARY_BORROW_LIMIT:5}
app.library.fine-per-day=${LIBRARY_FINE_PER_DAY:5}
app.librarian.setup-key=${LIBRARIAN_SETUP_KEY:}
